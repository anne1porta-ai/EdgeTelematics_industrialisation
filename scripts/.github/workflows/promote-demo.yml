name: Promotion manuelle - demonstration
run-name: Promotion de demonstration du run CI ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID du run Bloc 3 CI termine avec succes a promouvoir
        required: true
        type: string

# Le lancement manuel vaut Go pour ce POC ; aucun role CTO n'est impose.
# Le simulateur ecrit un etat local sur le runner GitHub.
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    name: Promouvoir le meme paquet en simulation
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les outils de simulation
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verifier le run CI choisi
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id doit etre un identifiant numerique."
            exit 1
          fi
          mkdir -p promotion-metadata
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > promotion-metadata/source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bloc3-ci.yml" > promotion-metadata/source-workflow.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("promotion-metadata/source-run.json").read_text())
          workflow = json.loads(Path("promotion-metadata/source-workflow.json").read_text())
          expected_path = ".github/workflows/bloc3-ci.yml"
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("Le run source doit etre termine avec la conclusion success.")
          if workflow.get("path") != expected_path:
              raise SystemExit("Le workflow source n'est pas Bloc 3 CI.")
          if run.get("workflow_id") != workflow.get("id"):
              raise SystemExit("Le run choisi provient d'un autre workflow.")
          if run.get("path", "").split("@", 1)[0] != expected_path:
              raise SystemExit("Le chemin du workflow du run source est incorrect.")
          if run.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Le run source doit appartenir a ce depot.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run_id={run['id']}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("## Promotion de demonstration", file=summary)
              print(f"Run CI valide : {run['html_url']}", file=summary)
              print(f"Commit source : {run['head_sha']}", file=summary)
              print(f"Lancement manuel par : {os.environ['GITHUB_ACTOR']}", file=summary)
              print("Le paquet valide est reutilise sans reconstruction.", file=summary)
          PY
      - name: Recuperer le paquet valide de ce run
        uses: actions/download-artifact@v8
        with:
          name: greenmove-validated-package
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Simuler la promotion du paquet
        run: python -m src.ota.simulate_update --manifest dist/manifest.json --state-dir production-demo
      - name: Conserver le statut et la provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-promotion-status
          path: |
            production-demo/
            promotion-metadata/
          if-no-files-found: warn
          retention-days: 30
      - name: Conserver le paquet promu
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-promoted-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
