name: Bloc 3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Qualite - Ruff et mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les outils CI
        run: python -m pip install -r requirements-ci.txt
      - name: Verifier le code
        run: python -m ruff check --isolated --select E4,E7,E9,F,I .
      - name: Verifier les types
        run: python -m mypy --explicit-package-bases --check-untyped-defs src scripts run_demo.py run_bloc3_demo.py

  tests:
    name: Tests - pytest et rapport JUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les outils CI
        run: python -m pip install -r requirements-ci.txt
      - name: Executer les tests
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Conserver le rapport meme apres un echec
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Securite - Bandit, pip-audit et Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les outils CI
        run: |
          mkdir -p reports
          python -m pip install -r requirements-ci.txt
      - name: Analyser le code applicatif avec Bandit
        if: ${{ !cancelled() }}
        run: python -m bandit -r src scripts run_demo.py run_bloc3_demo.py -f json -o reports/bandit.json
      - name: Auditer les dependances du projet
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r requirements.txt --format json --output reports/pip-audit.json
      - name: Rechercher les secrets avec la CLI officielle Gitleaks
        if: ${{ !cancelled() }}
        # Image publique officielle : aucune licence ni cle Gitleaks necessaire.
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/repo" --workdir /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --report-format json --report-path reports/gitleaks.json .
      - name: Conserver les rapports de securite
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: Construire le paquet et son manifeste
    needs: [quality, tests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Construire une seule fois
        run: python -m scripts.build_package --version "demo-${GITHUB_RUN_NUMBER}" --commit "$GITHUB_SHA" --output-dir dist
      - name: Conserver le paquet construit
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

  staging:
    name: Staging simule - paquet, demonstration et rollback
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Installer les dependances du projet
        run: python -m pip install -r requirements.txt
      - name: Recuperer le paquet construit
        uses: actions/download-artifact@v8
        with:
          name: greenmove-build
          path: dist/
      - name: Verifier et exercer ce paquet en simulation
        run: python -m scripts.staging_demo --manifest dist/manifest.json --output-dir staging
      - name: Conserver le rapport de staging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-staging-report
          path: staging/
          if-no-files-found: warn
          retention-days: 30
      - name: Rendre le paquet valide disponible pour la promotion manuelle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: greenmove-validated-package
          path: dist/
          if-no-files-found: error
          retention-days: 30
