name: Promotion OTA - Demo

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "ID du run Bloc 3 CI a promouvoir"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  promote:
    name: Verify, stage and simulate OTA rollout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exactly the artifact produced by the selected CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p promoted
          gh run download "$RUN_ID" -n ota-signed-package -D promoted

      - name: Verify hash and signature
        run: |
          cd promoted
          PACKAGE="$(ls edge-telematics-*.zip | head -n 1)"
          sha256sum -c "${PACKAGE}.sha256"
          openssl dgst -sha256 -verify ../keys/ota_public.pem -signature "${PACKAGE}.sig" "$PACKAGE"
          echo "SIGNED_ARTIFACT=$PACKAGE" >> "$GITHUB_ENV"

      - name: Simulated staging
        run: |
          echo "Staging simulated on the exact signed artifact: $SIGNED_ARTIFACT"
          python scripts/demo_ota_rollout.py --mode staging

      - name: Manual Go/No-Go represented by workflow_dispatch
        run: echo "GO/NO-GO manual approval received for this demo run"

      - name: Simulate progressive OTA rollout and rollback N-1
        run: python scripts/demo_ota_rollout.py --mode rollout
