name: Bloc 3 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality - Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy
      - run: ruff check .
      - run: mypy src scripts run_demo.py run_bloc3_demo.py --ignore-missing-imports

  tests:
    name: Tests - pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest -q --junitxml=report.xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

  security:
    name: Security - Bandit, pip-audit, Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install bandit pip-audit
      - run: bandit -r src scripts run_demo.py run_bloc3_demo.py
      - run: pip-audit -r requirements.txt
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  build_sign:
    name: Build OTA - hash and signature
    needs: [quality, tests, security]
    runs-on: ubuntu-latest
    env:
      VERSION: "1.2.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build immutable OTA package
        run: python scripts/build_ota_package.py --version "$VERSION" --commit "${{ github.sha }}"

      - name: Restore private signing key from GitHub Secret
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$OTA_SIGNING_PRIVATE_KEY" || (echo "Missing OTA_SIGNING_PRIVATE_KEY secret" && exit 1)
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > ota_private.pem
          chmod 600 ota_private.pem

      - name: Sign SHA-256 digest
        run: |
          PACKAGE="dist/edge-telematics-${VERSION}.zip"
          openssl dgst -sha256 -sign ota_private.pem -out "${PACKAGE}.sig" "$PACKAGE"
          sha256sum "$PACKAGE" > "${PACKAGE}.sha256"

      - name: Verify signature before publishing artifact
        run: |
          PACKAGE="dist/edge-telematics-${VERSION}.zip"
          openssl dgst -sha256 -verify keys/ota_public.pem -signature "${PACKAGE}.sig" "$PACKAGE"
          sha256sum -c "${PACKAGE}.sha256"

      - name: Remove private key
        if: always()
        run: rm -f ota_private.pem

      - name: Upload signed OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-signed-package
          path: |
            dist/edge-telematics-${{ env.VERSION }}.zip
            dist/edge-telematics-${{ env.VERSION }}.zip.sha256
            dist/edge-telematics-${{ env.VERSION }}.zip.sig
            dist/manifest.json
